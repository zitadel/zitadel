# Few pull requests, each one worth merging:
# - one pull request per group a month, with minor and patch
#   releases at least a week old, so a broken release is usually replaced
#   before it reaches us;
# - majors stay manual, but still arrive as security updates, which are
#   grouped into one pull request per entry;
# - merge or close what Dependabot opens. It pauses itself, security updates
#   included, once one of its pull requests has been open 90 days with no one
#   acting on any of them.
#
# The Dockerfiles have no entry: their floating tags (debian:latest,
# node:24-alpine, ubi9/nodejs-24) only change at a major, which stays manual.
version: 2
updates:
  # The whole pnpm workspace (pnpm-workspace.yaml): apps/*, console,
  # packages/*, tests/* and deploy/compose. It has to be one entry at the
  # root: an entry for a workspace folder such as /apps/login bumps only that
  # folder's package.json and leaves the root pnpm-lock.yaml behind, so
  # `pnpm install --frozen-lockfile` fails in CI.
  # A dependency goes to the first group that matches it, so Next.js, Angular
  # and OpenTelemetry each get their own pull request and the rest share one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # update-types affects version updates only, so majors still arrive as
    # security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Shipped in the login image and the docs site.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]
      # The console.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
        update-types: [minor, patch]
      # The login's telemetry. Its 0.x packages break in minor releases, so
      # they must not hold back the rest.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
        update-types: [minor, patch]
      npm:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # The k6 benchmark sits outside the workspace with its own lockfile.
  # Security updates only: a limit of 0 turns version updates off.
  - package-ecosystem: npm
    directory: /benchmark
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      benchmark-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # The server module and the login's acceptance-test modules.
  - package-ecosystem: gomod
    directories:
      - /
      - /apps/login/acceptance/*
      - /apps/login/acceptance/idp/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # The actions the workflows use, majors included: they are pinned by major
  # tag, so nothing else proposes a new one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
