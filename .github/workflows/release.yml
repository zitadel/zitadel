name: Release

on:
  workflow_call:
    inputs:
      semantic_version:
        required: true
        type: string
      image_name_github_api:
        required: true
        type: string
      image_name_google_api:
        required: true
        type: string
      image_name_github_login:
        required: true
        type: string
      image_name_google_login:
        required: true
        type: string
    secrets:
      GCR_JSON_KEY_BASE64:
        description: 'base64 endcrypted key to connect to Google'
        required: true
      APP_ID:
        description: 'GH App ID to request token for homebrew update'
        required: true
      APP_PRIVATE_KEY:
        description: 'GH App Private Key to request token for homebrew update'
        required: true

jobs:
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: write
    with:
      semantic_version: ${{ inputs.semantic_version }}
      dry_run: false

  # TODO: remove the publish job and publish releases directly with the @semantic-release/github plugin (remove draftRelease: true)
  # as soon as it supports configuring the create release payload property make_latest to "legacy"
  # https://docs.github.com/en/rest/releases/releases?apiVersion=2022-11-28#create-a-release--parameters
  publish:
    runs-on: ubuntu-22.04
    needs: version
    if: needs.version.outputs.published == 'true'
    steps:
      - id: get_release
        uses: cardinalby/git-get-release-action@v1
        with:
          commitSha: ${{ github.sha }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.get_release.outputs.id }},
              draft: false,
              make_latest: "legacy"
            });

  docker:
    runs-on: ubuntu-22.04
    needs: [ version ]
    if: needs.version.outputs.published == 'true'
    steps:
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - 
      name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Login to Google Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: europe-docker.pkg.dev
        username: _json_key_base64
        password: ${{ secrets.GCR_JSON_KEY_BASE64 }}
    -
      name: Publish ${{ needs.version.outputs.version }}
      run: |
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_github_api }}:${{ needs.version.outputs.version }} \
          ${{ inputs.image_name_github_api }}:${{ github.sha }}
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_github_api }}:${{ needs.version.outputs.version }}-debug \
          ${{ inputs.image_name_github_api }}:${{ github.sha }}-debug
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_api }}:${{ needs.version.outputs.version }} \
          ${{ inputs.image_name_google_api }}:${{ github.sha }}
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_api }}:${{ needs.version.outputs.version }}-fips \
          ${{ inputs.image_name_google_api }}:${{ github.sha }}-fips
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_api }}:${{ needs.version.outputs.version }}-fips-debug \
          ${{ inputs.image_name_google_api }}:${{ github.sha }}-fips-debug
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_github_login }}:${{ needs.version.outputs.version }} \
          ${{ inputs.image_name_github_login }}:${{ github.sha }}
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_login }}:${{ needs.version.outputs.version }} \
          ${{ inputs.image_name_google_login }}:${{ github.sha }}
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_login }}:${{ needs.version.outputs.version }}-fips \
          ${{ inputs.image_name_google_login }}:${{ github.sha }}-fips
    -
      name: Publish latest
      if: ${{ github.ref_name == 'next' }}
      run: |
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_github_api }}:latest \
          ${{ inputs.image_name_github_api }}:${{ github.sha }}
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_github_api }}:latest-debug \
          ${{ inputs.image_name_github_api }}:${{ github.sha }}-debug
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_github_login }}:latest \
          ${{ inputs.image_name_github_login }}:${{ github.sha }}
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_api }}:latest-fips \
          ${{ inputs.image_name_google_api }}:${{ github.sha }}-fips
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_api }}:latest-fips-debug \
          ${{ inputs.image_name_google_api }}:${{ github.sha }}-fips-debug
        docker buildx imagetools create \
          --tag ${{ inputs.image_name_google_login }}:latest-fips \
          ${{ inputs.image_name_google_login }}:${{ github.sha }}-fips

  homebrew-tap:
    runs-on: ubuntu-22.04
    needs: version
    if: needs.version.outputs.published == 'true' && github.ref_name == 'next'
    continue-on-error: true
    steps:
    - name: generate token
      uses: tibdex/github-app-token@v2
      id: generate-token
      with:
        app_id: ${{ secrets.APP_ID }}
        private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Trigger Homebrew
      env:
        VERSION: ${{ needs.version.outputs.version }}
        RUN_ID: ${{ github.run_id }}
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        gh workflow -R zitadel/homebrew-tap run update.yml -f runId=${RUN_ID} -f version=${VERSION}

  helm-chart:
    runs-on: ubuntu-22.04
    needs: version
    if: needs.version.outputs.published == 'true' && github.ref_name == 'next'
    continue-on-error: true
    steps:
      - name: generate token
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Trigger Chart Bump
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh workflow -R zitadel/zitadel-charts run bump.yml

  # Publishes @zitadel/proto and @zitadel/client to npm with the exact same
  # version as the ZITADEL release (e.g. v4.18.0 -> 4.18.0). Authentication
  # uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
  # Both packages must be configured on npmjs.com with the trusted publisher
  # zitadel/zitadel, workflow file "ci.yml" (the *calling* workflow).
  npm-packages:
    runs-on: ubuntu-22.04
    needs: version
    if: needs.version.outputs.published == 'true' && (github.ref_name == 'next' || github.ref_name == 'next-rc')
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # npm >= 11.5.1 is required for trusted publishing (pnpm publish delegates to npm)
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many --targets=generate,build --projects=@zitadel/proto,@zitadel/client

      - name: Set package versions to ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pnpm --filter @zitadel/proto --filter @zitadel/client exec npm pkg set version="${VERSION#v}"

      - name: Publish ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # prereleases (next-rc, e.g. v4.18.0-rc.1) go to the "rc" dist-tag, everything else to "latest"
          if [[ "${VERSION}" == *-* ]]; then TAG="rc"; else TAG="latest"; fi
          pnpm publish \
            --recursive \
            --filter @zitadel/proto \
            --filter @zitadel/client \
            --access public \
            --tag "${TAG}" \
            --no-git-checks
