name: Fork Image

# Builds and pushes ZITADEL API + Login container images to this fork's own
# GHCR namespace. Independent of the upstream release pipeline: no self-hosted
# runners, no Google Artifact Registry, no Nx Cloud, no semantic-release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (in addition to the commit SHA)"
        required: false
        default: "catalan"
      platforms:
        description: "Target platforms. linux/arm64 needs QEMU and is much slower."
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/amd64,linux/arm64"
  push:
    tags:
      - "fork-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # nx.json pins an upstream nxCloudId we have no token for.
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Resolve image names and version
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api_image=${REGISTRY}/${owner}/zitadel" >> "$GITHUB_OUTPUT"
          echo "login_image=${REGISTRY}/${owner}/zitadel-login" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#fork-}"
          else
            version="${{ inputs.tag }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "platforms=${{ inputs.platforms || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compiles the console (incl. console/src/assets/i18n/ca.json) and embeds
      # the login v1 i18n YAMLs (incl. internal/api/ui/login/static/i18n/ca.yaml)
      # into the Go binary via statik.
      - name: Build Linux API binaries
        env:
          ZITADEL_VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm nx run-many --nxBail -p @zitadel/api -t pack-linux-amd64,pack-linux-arm64

      # Produces apps/login/.next/standalone, which bundles apps/login/locales/ca.json.
      - name: Build Login standalone
        run: pnpm nx run --nxBail @zitadel/login:build

      - name: Set up QEMU
        if: contains(steps.meta.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels for the API image
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.api_image }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=${{ steps.meta.outputs.version }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          cache-from: type=gha,scope=fork-api
          cache-to: type=gha,mode=max,scope=fork-api
          labels: ${{ steps.api-meta.outputs.labels }}
          tags: ${{ steps.api-meta.outputs.tags }}

      - name: Tags and labels for the Login image
        id: login-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.login_image }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=${{ steps.meta.outputs.version }}

      - name: Build and push the Login image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          cache-from: type=gha,scope=fork-login
          cache-to: type=gha,mode=max,scope=fork-login
          labels: ${{ steps.login-meta.outputs.labels }}
          tags: ${{ steps.login-meta.outputs.tags }}

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.meta.outputs.login_image }}:${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
