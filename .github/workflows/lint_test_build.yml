name: Lint Test Build

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  lint_test_build:
    name: Lint, Test and Build
    runs-on: depot-ubuntu-22.04-16
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Fetch main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: git fetch origin main:main
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.3.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.28.0
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: v2.38.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set SHAs for nx affected commands
        uses: nrwl/nx-set-shas@v4
      # The Depot runner image points /etc/resolv.conf directly at public DNS (8.8.8.8),
      # bypassing the systemd-resolved stub, so *.integration.localhost (synthesized by
      # systemd-resolved) no longer resolves and all API integration tests hang.
      # Route DNS back through the stub until the image is fixed or the tests stop
      # depending on wildcard localhost DNS.
      - name: Restore systemd-resolved stub for *.localhost resolution
        run: |
          set -ex
          test -e /run/systemd/resolve/stub-resolv.conf
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          getent hosts foo.integration.localhost
      # The Nx task cache lives in nx-task-cache artifacts; .github/scripts/nx-task-cache.mjs says why.
      - name: Find the Nx task cache
        id: nx-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
        run: node .github/scripts/nx-task-cache.mjs find nx-task-cache
      - name: Download the Nx task cache of main
        if: steps.nx-cache.outputs.main-run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nx-task-cache
          run-id: ${{ steps.nx-cache.outputs.main-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nx-task-cache
      - name: Download the Nx task cache of this branch
        if: steps.nx-cache.outputs.branch-run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nx-task-cache
          run-id: ${{ steps.nx-cache.outputs.branch-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nx-task-cache-branch
      - name: Serve the Nx task cache
        run: |
          store="$RUNNER_TEMP/nx-task-cache"
          mkdir -p "$store" "$store-branch"
          ls "$store" > "$store.main"
          find "$store-branch" -type f -exec mv {} "$store"/ \;
          node .github/scripts/nx-task-cache.mjs serve "$store" > "$store.server.log" 2>&1 &
          for _ in $(seq 100); do [ -s "$store.url" ] && break; sleep 0.1; done
          if [ -s "$store.url" ]; then
            echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=$(cat "$store.url")" >> "$GITHUB_ENV"
          else
            echo "::warning::The Nx task cache server did not start; running without it"
            cat "$store.server.log"
          fi
      # Outside pull requests, Nx runs every task so the uploaded cache holds them all.
      - name: Lint, Test and Build
        id: nx
        env:
          NX_DAEMON: "false"
        run: pnpm nx ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }} --nxBail --targets lint test build --exclude @zitadel/docs
      - name: Keep the Nx task cache entries this job used
        if: ${{ !cancelled() && steps.nx.outcome != 'skipped' }}
        run: |
          store="$RUNNER_TEMP/nx-task-cache"
          # A pull request uploads only entries main's cache lacks.
          skip=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then skip="$store.main"; fi
          node .github/scripts/nx-task-cache.mjs prune "$store" $skip
      - name: Upload the Nx task cache
        if: ${{ !cancelled() && steps.nx.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: nx-task-cache
          path: ${{ runner.temp }}/nx-task-cache
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
          compression-level: 0
          if-no-files-found: ignore
          overwrite: true
      - name: Check for uncommitted changes (Codegen mismatch)
        run: git diff --exit-code
      - name: Publish API Unit Test Coverage
        uses: codecov/codecov-action@v4.3.0
        with:
          file: profile.api.test-unit.cov
          name: api-test-unit
          flags: api-test-unit
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Publish API Integration Test Coverage
        uses: codecov/codecov-action@v4.3.0
        with:
          file: profile.api.test-integration.cov
          name: api-test-integration
          flags: api-test-integration
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload API Integration Test Race Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-test-race-logs
          path: |
            .artifacts/api-test-integration/race.log.*
      - name: Upload Functional UI Test Artifacts
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: functional-ui-tests
          path: |
            tests/functional-ui/cypress/screenshots
            tests/functional-ui/cypress/videos
            tests/functional-ui/cypress/results
