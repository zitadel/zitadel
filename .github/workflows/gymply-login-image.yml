# Gymply's patched Login V2 image, built from this fork until the patches are released upstream.
#
# A tag `v<upstream version>-gymply.<n>` on a `gymply/v<upstream version>` branch (the upstream release
# tag plus Gymply's patches) publishes ghcr.io/<owner>/zitadel-login:<tag>. Build steps follow
# upstream's pack.yml (Login standalone build, then apps/login/Dockerfile), for linux/amd64 only:
# Gymply's hosts are amd64.
name: Gymply login image

on:
  push:
    tags:
      - "v*-gymply.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Login
        run: pnpm nx run --nxBail @zitadel/login:test-unit
      - name: Build Login standalone
        run: pnpm nx run --nxBail @zitadel/login:build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Tags and Labels for the Login Container Image
        id: login-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zitadel-login
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=ZITADEL Login V2 with Gymply's patches pending upstream
          tags: |
            type=ref,event=tag
            type=sha,prefix=,suffix=,format=long
      - name: Build and Push the Login Container Image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          platforms: linux/amd64
          push: true
          labels: ${{ steps.login-meta.outputs.labels }}
          tags: ${{ steps.login-meta.outputs.tags }}
