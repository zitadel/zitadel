packages:
  - console
  - tests/*
  - packages/*
  - apps/*
  - deploy/compose

exclude:
  - benchmark # because of the node 18 or 20 dependency

# Only for transitive dependencies whose parent pins a vulnerable version and
# has no fixed release yet. Name the pinning parent so the entry can be removed
# once the parent is updated. See skills/npm-dependency-audit.md.
overrides:
  # nx pins brace-expansion 5.0.8 and smol-toml 1.6.1 (latest nx 22.x and 23.x)
  "brace-expansion@>=4.0.0 <5.0.9": "^5.0.9"
  "smol-toml@<1.7.1": "^1.7.1"
  # tsup (via @zitadel/client) allows esbuild ^0.27 only
  "esbuild@>=0.27.3 <0.28.1": "^0.28.1"
  # @opentelemetry/sdk-node 0.218 and auto-instrumentations-node 0.76 (login) pin older versions
  "@opentelemetry/core@<2.8.0": "^2.8.0"
  "@opentelemetry/propagator-jaeger@<2.9.0": "^2.9.0"
