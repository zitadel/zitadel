InitCode:
  Title: "Пайдаланушыны бастапқы баптау"
  PreHeader: "Пайдаланушыны бастапқы баптау"
  Subject: "Пайдаланушыны бастапқы баптау"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Бұл пайдаланушы жасалды. Кіру үшін {{.PreferredLoginName}} пайдаланушы атын пайдаланыңыз. Бастапқы баптауды аяқтау үшін төмендегі түймені басыңыз. (Код: {{.Code}}) Бұл хатты сұрамаған болсаңыз, оны елемеңіз."
  ButtonText: "Баптауды аяқтау"
PasswordReset:
  Title: "Құпиясөзді қалпына келтіру"
  PreHeader: "Құпиясөзді қалпына келтіру"
  Subject: "Құпиясөзді қалпына келтіру"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Құпиясөзді қалпына келтіру туралы сұрау алдық. Құпиясөзіңізді қалпына келтіру үшін төмендегі түймені басыңыз. (Код: {{.Code}}) Бұл хатты сұрамаған болсаңыз, оны елемеңіз."
  ButtonText: "Құпиясөзді қалпына келтіру"
VerifyEmail:
  Title: "Электрондық поштаны растау"
  PreHeader: "Электрондық поштаны растау"
  Subject: "Электрондық поштаны растау"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Жаңа электрондық пошта мекенжайы қосылды. Оны растау үшін төмендегі түймені басыңыз. (Код: {{.Code}}) Жаңа электрондық пошта мекенжайын қоспаған болсаңыз, бұл хатты елемеңіз."
  ButtonText: "Электрондық поштаны растау"
VerifyPhone:
  Title: "Телефонды растау"
  PreHeader: "Телефонды растау"
  Subject: "Телефонды растау"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Жаңа телефон нөмірі қосылды. Оны растау үшін мына кодты пайдаланыңыз: {{.Code}}"
  ButtonText: "Телефонды растау"
VerifyEmailOTP:
  Title: "Бір реттік құпиякодты (OTP) растау"
  PreHeader: "Бір реттік құпиякодты (OTP) растау"
  Subject: "Бір реттік құпиякодты (OTP) растау"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Келесі бес минут ішінде аутентификациядан өту үшін {{.OTP}} бір реттік құпиякодын (OTP) пайдаланыңыз немесе «Аутентификациядан өту» түймесін басыңыз."
  ButtonText: "Аутентификациядан өту"
VerifySMSOTP:
  Text: >-
    {{.OTP}} — {{ .Domain }} үшін бір реттік құпиякодыңыз (OTP). Оны {{.Expiry}} ішінде пайдаланыңыз.

    @{{.Domain}} #{{.OTP}}
DomainClaimed:
  Title: "Домен иеленіп қойылған"
  PreHeader: "Электрондық поштаны / пайдаланушы атын өзгерту"
  Subject: "Домен иеленіп қойылған"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "{{.Domain}} доменін бір ұйым иеленді. Қазіргі {{.Username}} пайдаланушыңыз бұл ұйымға кірмейді. Сондықтан жүйеге кіргенде электрондық пошта мекенжайыңызды өзгертуіңіз керек. Осы жолғы кіруіңіз үшін уақытша пайдаланушы аты ({{.TempUsername}}) жасалды."
  ButtonText: "Кіру"
PasswordlessRegistration:
  Title: "Кіру кілтімен кіруді қосу"
  PreHeader: "Кіру кілтімен кіруді қосу"
  Subject: "Кіру кілтімен кіруді қосу"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Кіру кілтімен кіру үшін токен қосу туралы сұрау алдық. Кіру кілтімен кіруге арналған токенді немесе құрылғыны қосу үшін төмендегі түймені басыңыз."
  ButtonText: "Кіру кілтімен кіруді қосу"
PasswordChange:
  Title: "Пайдаланушының құпиясөзі өзгертілді"
  PreHeader: "Құпиясөзді өзгерту"
  Subject: "Пайдаланушының құпиясөзі өзгертілді"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Пайдаланушыңыздың құпиясөзі өзгертілді. Бұл өзгерісті Сіз жасамаған болсаңыз, құпиясөзіңізді дереу қалпына келтіріңіз."
  ButtonText: "Кіру"
InviteUser:
  Title: "{{.ApplicationName}} қызметіне шақыру"
  PreHeader: "{{.ApplicationName}} қызметіне шақыру"
  Subject: "{{.ApplicationName}} қызметіне шақыру"
  Greeting: "Сәлеметсіз бе, {{.DisplayName}},"
  Text: "Пайдаланушыңыз {{.ApplicationName}} қызметіне шақырылды. Шақыруды қабылдау үшін төмендегі түймені басыңыз. Бұл хатты сұрамаған болсаңыз, оны елемеңіз."
  ButtonText: "Шақыруды қабылдау"
