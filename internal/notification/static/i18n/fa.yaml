InitCode:
  Title: راه‌اندازی کاربر
  PreHeader: راه‌اندازی کاربر
  Subject: راه‌اندازی کاربر
  Greeting: سلام {{.DisplayName}}،
  Text: این کاربر ایجاد شده است. برای ورود از نام کاربری {{.PreferredLoginName}} استفاده کنید. لطفاً برای تکمیل فرایند راه‌اندازی روی دکمهٔ زیر کلیک کنید. (کد {{.Code}}) اگر این ایمیل را درخواست نکرده‌اید، لطفاً آن را نادیده بگیرید.
  ButtonText: تکمیل راه‌اندازی
PasswordReset:
  Title: بازنشانی گذرواژه
  PreHeader: بازنشانی گذرواژه
  Subject: بازنشانی گذرواژه
  Greeting: سلام {{.DisplayName}}،
  Text: درخواستی برای بازنشانی گذرواژه دریافت کردیم. لطفاً برای بازنشانی گذرواژهٔ خود از دکمهٔ زیر استفاده کنید. (کد {{.Code}}) اگر این ایمیل را درخواست نکرده‌اید، لطفاً آن را نادیده بگیرید.
  ButtonText: بازنشانی گذرواژه
VerifyEmail:
  Title: تأیید ایمیل
  PreHeader: تأیید ایمیل
  Subject: تأیید ایمیل
  Greeting: سلام {{.DisplayName}}،
  Text: یک ایمیل جدید اضافه شده است. لطفاً برای تأیید ایمیل خود از دکمهٔ زیر استفاده کنید. (کد {{.Code}}) اگر ایمیل جدیدی اضافه نکرده‌اید، لطفاً این ایمیل را نادیده بگیرید.
  ButtonText: تأیید ایمیل
VerifyPhone:
  Title: تأیید شمارهٔ تلفن
  PreHeader: تأیید شمارهٔ تلفن
  Subject: تأیید شمارهٔ تلفن
  Greeting: سلام {{.DisplayName}}،
  Text: یک شمارهٔ تلفن جدید اضافه شده است. لطفاً برای تأیید آن از این کد استفاده کنید {{.Code}}
  ButtonText: تأیید شمارهٔ تلفن
VerifyEmailOTP:
  Title: تأیید رمز یک‌بار مصرف
  PreHeader: تأیید رمز یک‌بار مصرف
  Subject: تأیید رمز یک‌بار مصرف
  Greeting: سلام {{.DisplayName}}،
  Text: لطفاً ظرف پنج دقیقهٔ آینده از رمز یک‌بار مصرف {{.OTP}} برای احراز هویت استفاده کنید یا روی دکمهٔ «احراز هویت» کلیک کنید.
  ButtonText: احراز هویت
VerifySMSOTP:
  Text: >-
    {{.OTP}} رمز یک‌بار مصرف شما برای {{ .Domain }} است. آن را ظرف {{.Expiry}} آینده استفاده کنید.

    @{{.Domain}} #{{.OTP}}
DomainClaimed:
  Title: دامنه تصاحب شده است
  PreHeader: تغییر ایمیل / نام کاربری
  Subject: دامنه تصاحب شده است
  Greeting: سلام {{.DisplayName}}،
  Text: دامنهٔ {{.Domain}} توسط یک سازمان تصاحب شده است. کاربر فعلی شما {{.Username}} عضو این سازمان نیست؛ بنابراین هنگام ورود باید ایمیل خود را تغییر دهید. برای این ورود یک نام کاربری موقت ({{.TempUsername}}) برای شما ایجاد کرده‌ایم.
  ButtonText: ورود
PasswordlessRegistration:
  Title: افزودن ورود با کلید عبور (Passkey)
  PreHeader: افزودن ورود با کلید عبور (Passkey)
  Subject: افزودن ورود با کلید عبور (Passkey)
  Greeting: سلام {{.DisplayName}}،
  Text: درخواستی برای افزودن یک توکن جهت ورود با کلید عبور دریافت کردیم. لطفاً برای افزودن توکن یا دستگاه خود جهت ورود با کلید عبور از دکمهٔ زیر استفاده کنید.
  ButtonText: افزودن ورود با کلید عبور
PasswordChange:
  Title: گذرواژهٔ کاربر تغییر کرده است
  PreHeader: تغییر گذرواژه
  Subject: گذرواژهٔ کاربر تغییر کرده است
  Greeting: سلام {{.DisplayName}}،
  Text: گذرواژهٔ کاربر شما تغییر کرده است. اگر این تغییر توسط شما انجام نشده است، توصیه می‌شود فوراً گذرواژهٔ خود را بازنشانی کنید.
  ButtonText: ورود
InviteUser:
  Title: دعوت به {{.ApplicationName}}
  PreHeader: دعوت به {{.ApplicationName}}
  Subject: دعوت به {{.ApplicationName}}
  Greeting: سلام {{.DisplayName}}،
  Text: کاربر شما به {{.ApplicationName}} دعوت شده است. لطفاً برای تکمیل فرایند دعوت روی دکمهٔ زیر کلیک کنید. اگر این ایمیل را درخواست نکرده‌اید، لطفاً آن را نادیده بگیرید.
  ButtonText: پذیرفتن دعوت
